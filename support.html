<body><main><h1>SquirrelDeck (松械平台) 支援資訊</h1><p>若需要回報問題、提出功能建議，或詢問 Google Drive 同步、GitHub Actions 雲端擷取、權限與資料處理方式，請使用 SquirrelDeck Chrome Web Store 商品頁所列的開發者聯絡管道。</p><h2>回報 GitHub 雲端擷取問題時</h2><p>建議附上 Chrome 版本、作業系統、SquirrelDeck 版本、GitHub Actions Run 狀態／錯誤訊息及可重現步驟。請勿公開貼出 OAuth token、授權碼或其他憑證。</p><p><a href="index.html#privacy">隱私權政策</a> · <a href="index.html#home">返回首頁</a></p></main></body></html>
